<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
            padding: 40px 0;
        }

        .registration-card {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .title {
            text-align: center;
            color: #0d6efd;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .required {
            color: red;
        }

        .btn {
            min-width: 130px;
        }

        #successMessage {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="registration-card">

        <h2 class="title">Student Registration Form</h2>

        <!-- Success Message -->
        <div id="successMessage" class="alert alert-success">
            Student Registration Successful!
        </div>

        <form id="studentForm">

            <div class="row">

                <!-- Student Name -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Student Name <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="studentName"
                           class="form-control"
                           placeholder="Enter student name">
                    <small class="text-danger" id="nameError"></small>
                </div>

                <!-- Register Number -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Register Number <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="registerNumber"
                           class="form-control"
                           placeholder="Enter register number">
                    <small class="text-danger" id="registerError"></small>
                </div>

                <!-- Email -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Email <span class="required">*</span>
                    </label>
                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="example@gmail.com">
                    <small class="text-danger" id="emailError"></small>
                </div>

                <!-- Mobile -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Mobile Number <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="mobile"
                           class="form-control"
                           placeholder="Enter 10-digit mobile number">
                    <small class="text-danger" id="mobileError"></small>
                </div>

                <!-- Date of Birth -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Date of Birth <span class="required">*</span>
                    </label>
                    <input type="date"
                           id="dob"
                           class="form-control">
                </div>

                <!-- Gender -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Gender <span class="required">*</span>
                    </label>

                    <div class="mt-2">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="gender"
                                   value="Male">
                            <label class="form-check-label">Male</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="gender"
                                   value="Female">
                            <label class="form-check-label">Female</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="gender"
                                   value="Other">
                            <label class="form-check-label">Other</label>
                        </div>
                    </div>
                </div>

                <!-- Department -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Department <span class="required">*</span>
                    </label>

                    <select id="department" class="form-select">
                        <option value="">Select Department</option>
                        <option value="CSE">Computer Science Engineering</option>
                        <option value="ECE">Electronics and Communication</option>
                        <option value="EEE">Electrical and Electronics</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="IT">Information Technology</option>
                    </select>
                </div>

                <!-- Year -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Year <span class="required">*</span>
                    </label>

                    <select id="year" class="form-select">
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <!-- Address -->
                <div class="col-12 mb-3">
                    <label class="form-label">
                        Address <span class="required">*</span>
                    </label>

                    <textarea id="address"
                              class="form-control"
                              rows="3"
                              placeholder="Enter your address"></textarea>
                </div>

                <!-- Password -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Password <span class="required">*</span>
                    </label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="Enter password">
                </div>

                <!-- Confirm Password -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Confirm Password <span class="required">*</span>
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           placeholder="Confirm password">

                    <small class="text-danger" id="passwordError"></small>
                </div>

                <!-- Terms -->
                <div class="col-12 mb-3">
                    <div class="form-check">
                        <input type="checkbox"
                               id="terms"
                               class="form-check-input">

                        <label class="form-check-label">
                            I agree to the terms and conditions
                            <span class="required">*</span>
                        </label>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="col-12 text-center">

                    <button type="submit"
                            class="btn btn-primary me-2">
                        Register
                    </button>

                    <button type="reset"
                            class="btn btn-secondary">
                        Reset
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<script>

    // JavaScript + jQuery
    $(document).ready(function () {

        $("#studentForm").submit(function (event) {

            event.preventDefault();

            // Clear previous errors
            $(".text-danger").text("");

            let valid = true;

            // Get values
            let name = $("#studentName").val().trim();
            let registerNumber = $("#registerNumber").val().trim();
            let email = $("#email").val().trim();
            let mobile = $("#mobile").val().trim();
            let dob = $("#dob").val();
            let department = $("#department").val();
            let year = $("#year").val();
            let address = $("#address").val().trim();
            let password = $("#password").val();
            let confirmPassword = $("#confirmPassword").val();

            // Name validation
            if (name === "") {
                $("#nameError").text("Please enter student name.");
                valid = false;
            }
            else if (!/^[A-Za-z ]+$/.test(name)) {
                $("#nameError").text("Name should contain only letters.");
                valid = false;
            }

            // Register number validation
            if (registerNumber === "") {
                $("#registerError").text("Please enter register number.");
                valid = false;
            }

            // Email validation
            let emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                $("#emailError").text("Please enter email.");
                valid = false;
            }
            else if (!emailPattern.test(email)) {
                $("#emailError").text("Enter a valid email.");
                valid = false;
            }

            // Mobile validation
            let mobilePattern = /^[0-9]{10}$/;

            if (mobile === "") {
                $("#mobileError").text("Please enter mobile number.");
                valid = false;
            }
            else if (!mobilePattern.test(mobile)) {
                $("#mobileError").text(
                    "Mobile number must contain 10 digits."
                );
                valid = false;
            }

            // Date validation
            if (dob === "") {
                alert("Please select date of birth.");
                valid = false;
            }

            // Gender validation
            if (!$("input[name='gender']:checked").val()) {
                alert("Please select gender.");
                valid = false;
            }

            // Department validation
            if (department === "") {
                alert("Please select department.");
                valid = false;
            }

            // Year validation
            if (year === "") {
                alert("Please select year.");
                valid = false;
            }

            // Address validation
            if (address === "") {
                alert("Please enter address.");
                valid = false;
            }

            // Password validation
            if (password === "") {
                alert("Please enter password.");
                valid = false;
            }
            else if (password.length < 6) {
                alert("Password must contain at least 6 characters.");
                valid = false;
            }

            // Confirm password
            if (confirmPassword === "") {
                $("#passwordError").text(
                    "Please confirm your password."
                );
                valid = false;
            }
            else if (password !== confirmPassword) {
                $("#passwordError").text(
                    "Passwords do not match."
                );
                valid = false;
            }

            // Terms validation
            if (!$("#terms").is(":checked")) {
                alert("Please accept the terms and conditions.");
                valid = false;
            }

            // Successful registration
            if (valid) {

                $("#successMessage")
                    .stop()
                    .fadeIn();

                // Display success for 3 seconds
                setTimeout(function () {
                    $("#successMessage").fadeOut();
                }, 3000);

                // Show registration data in console
                console.log("Student Name:", name);
                console.log("Register Number:", registerNumber);
                console.log("Email:", email);
                console.log("Mobile:", mobile);
                console.log("Date of Birth:", dob);
                console.log(
                    "Gender:",
                    $("input[name='gender']:checked").val()
                );
                console.log("Department:", department);
                console.log("Year:", year);
                console.log("Address:", address);

                // Reset form
                $("#studentForm")[0].reset();
            }

        });


        // jQuery: allow only numbers in mobile field
        $("#mobile").on("input", function () {
            this.value = this.value.replace(/[^0-9]/g, "");
        });


        // jQuery: show password match status
        $("#confirmPassword").on("keyup", function () {

            let password = $("#password").val();
            let confirmPassword = $(this).val();

            if (confirmPassword !== "" &&
                password !== confirmPassword) {

                $("#passwordError").text(
                    "Passwords do not match."
                );

            }
            else {

                $("#passwordError").text("");

            }

        });

    });

</script>

</body>
</html>
